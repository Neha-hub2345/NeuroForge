spring.application.name=NeuroForge
server.port=9000

# --- Database ---
# CHANGED: was likely jdbc:postgresql://localhost:5432/... when you were
# running Postgres directly on your machine. Now it's the compose
# service name "postgres" â Docker's internal DNS resolves that to the
# postgres container automatically. This only works because the backend
# ITSELF now also runs inside the same compose network; if you ever run
# the backend outside Docker again (e.g. `./mvnw spring-boot:run` on your
# host) while Postgres is in Docker, you'd need localhost:5432 again,
# since your host machine has no idea what "postgres" means.

github.token=${GITHUB_PAT:}
github.owner=${GITHUB_OWNER:}
github.repo=${GITHUB_REPO:}
github.workflow-file=ci-cd.yml
github.branch=main



app.encryption.secret=${APP_ENCRYPTION_SECRET:dev-only-change-me}
app.encryption.salt=${APP_ENCRYPTION_SALT:5c6d7e8f9a0b1c2d}

# Internal Docker-network address of Prometheus — used server-side only by
# ObservabilityController/PrometheusQueryService. Never exposed to the browser.
app.prometheus.base-url=${PROMETHEUS_BASE_URL:http://prometheus:9090}


# --- AI Assistant (Milestone 4+) ? xAI Grok ---
# --- AI Assistant (Milestone 4+) ? Groq ---
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.max-tokens=${GROQ_MAX_TOKENS:400}



# --- Actuator / Prometheus (M4 ? DevOps Observability) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=NeuroForge
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true




spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/neuroforge_nexus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Keycloak ---
# and issuer validation to use the same URL, which breaks once both
# Keycloak and the backend are in Docker but the browser is outside it.
# Replaced with two separate values (see SecurityConfig-addition.txt for
# the manual JwtDecoder bean this requires):
app.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/neuroforge-nexus/protocol/openid-connect/certs}
app.keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8080/realms/neuroforge-nexus}

#keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8080}
#keycloak.admin.realm=neuroforge-nexus
